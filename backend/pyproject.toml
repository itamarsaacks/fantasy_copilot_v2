[project]
name = "fantasy-copilot-backend"
version = "0.1.0"
description = "Fantasy NBA Copilot v2 backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",

    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.0",

    # Validation / config
    "pydantic>=2.10",
    "pydantic-settings>=2.6",

    # HTTP
    "httpx>=0.28",

    # Auth
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",

    # Scheduler
    "apscheduler>=3.10",

    # Agent (Phase 4 — installed now to keep environment stable)
    "deepagents>=0.0.5",
    "langchain-anthropic>=0.3",
    "langsmith>=0.2",
    "langchain-tavily>=0.2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",  # used by FastAPI TestClient too
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default rule set, with explicit ignores for patterns we deliberately use:
#   E402 — module-level import not at top of file. Legit when we MUST
#          set env vars (LANGSMITH_PROJECT, JWT_SECRET, etc.) before
#          importing app.* modules whose load-time `get_settings()` reads
#          them. Used in scripts/run_evals.py and tests/conftest.py.
#   E741 — ambiguous single-letter name (`l`). A few in legacy code;
#          not worth blocking CI for.
#   F841 — local variable assigned but never used. A small backlog
#          (currently 2 in routes/players.py); cleanup is its own task.
ignore = ["E402", "E741", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All async fixtures share the session-scoped event loop. Without this,
# session-scoped async fixtures (like our `_test_engine`) get created on
# one loop and function-scoped tests run on different per-test loops,
# producing "Event loop is closed" on connection teardown.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: requires a running Postgres test database. Run with `pytest -m db` after `docker compose up -d` and `createdb fantasy_copilot_test`. The pure-unit pass (the default in CI) excludes these via `-m 'not db'`.",
]
