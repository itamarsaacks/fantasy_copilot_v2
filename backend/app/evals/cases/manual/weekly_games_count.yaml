id: weekly_games_count
description: |
  User asks how many games a player has this week. Complete answer:
    1) game count this fantasy week
    2) opponents and home/away
    3) any back-to-back flags
  Essential: get_player_schedule (BACKLOG #3, shipped 2026-05-12).

intent:
  question_type: definitional
  complexity: simple
  domain: matchups
  answer_shape: number

phrasings:
  - "how many games does Embiid have this week"
  - "Embiid game count this week"
  - "Embiid's schedule this week"
  - "how many times does Embiid play this week"

expected:
  must_call_tools:
    - get_player_schedule
  must_not_call_tools:
    - get_top_players_overall
    - top_projected_free_agents
  response_contains_any:
    - "game"
    - "this week"
    - "opponent"
    - "play"
    - "schedule"
    - "Embiid"
  response_contains_none:
    - "I don't have"
    # Wrong-sport guards
    - "Eagles"
    - "Phillies"
  max_tool_calls: 4
  max_latency_ms: 25000
  min_response_chars: 80

tags:
  - matchups
  - schedule

provenance:
  source: manual
  source_chat_date: "2026-05-12"
