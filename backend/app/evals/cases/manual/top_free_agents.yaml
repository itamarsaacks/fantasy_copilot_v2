id: top_free_agents
description: |
  User asks for the best available free agents. Agent should call either
  top_projected_free_agents (preferred — projection-aware) or get_free_agents
  (ownership-ranked). Process-only — the specific recommendations vary per
  league and per sync.

  Tool budget: 3 total. The agent MAY call search_recent_news for injury
  context on flagged players, but should not exceed the budget. Once we
  build the injury_status table (see docs/BACKLOG.md #1), news search drops
  to zero for this case.


intent:
  question_type: recommendation
  complexity: moderate
  domain: waivers
  answer_shape: list

phrasings:
  - "who are the best free agents available"
  - "show me top free agents"
  - "best players I could pick up"
  - "which free agents should I look at"

expected:
  # Either FA-listing tool is acceptable. Don't reach into another team's
  # roster — that's a clear misroute.
  must_not_call_tools:
    - get_team_roster
  response_contains_any:
    # FA / waiver vocabulary
    - "free agent"
    - "available"
    - "availability"
    - "owned"
    - "pick up"
    - "pickup"
    - "waiver"
    # Health framing (we WANT the agent to surface healthy options)
    - "healthy"
    - "injured"
    - "INJ"
    - "GTD"
    - "out"
    # Projection / recommendation framing
    - "projected"
    - "fps"
    - "options"
    - "targets"
  response_contains_none:
    - "I don't have"
    - "I cannot determine"
    - "Dolphins"
    - "Cowboys"
    - "Yankees"
  # Tight budget: 1 FA tool call + at most 1-2 news lookups for injury context.
  # Three news calls is the over-eager pattern caught on 2026-05-12.
  max_tool_calls: 3
  max_latency_ms: 25000
  min_response_chars: 80

tags:
  - waivers
  - free_agents
  - core_smoke

provenance:
  source: manual
  source_chat_date: "2026-05-12"
