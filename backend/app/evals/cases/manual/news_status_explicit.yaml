id: news_status_explicit
description: |
  User explicitly asks for the latest news on a specific player.
  Complete answer should combine:
    1) structured status from get_injury_status (Yahoo-sourced: flag,
       description, free-text note)
    2) any narrative context from search_recent_news (rumors, lineup
       movements, beat reporter quotes)
  Essential: get_injury_status. The agent MAY also call search_recent_news
  but doesn't have to — Yahoo's note often answers the question already.

  Player chosen: Embiid — likely to exist in any v2 dev DB, has injury
  history so status/note typically populated.

intent:
  question_type: definitional
  complexity: simple
  domain: news
  answer_shape: explanation

phrasings:
  - "any news on Embiid"
  - "latest news on Joel Embiid"
  - "what's the latest on Embiid"
  - "how's Embiid doing — any updates"

expected:
  must_call_tools:
    - get_injury_status
  must_not_call_tools:
    # Agent shouldn't reach for projections / roster for a "news" question
    - get_player_projection
    - get_my_roster
    - get_team_roster
  response_contains_any:
    - "Embiid"
    - "Joel"
    - "76ers"
    - "Philadelphia"
    - "PHI"
    - "status"
    - "out"
    - "GTD"
    - "active"
  response_contains_none:
    - "I don't have"
    - "I cannot search"
    - "Eagles"           # PHI is the 76ers, NOT the Eagles
    - "Phillies"
  max_tool_calls: 3
  max_latency_ms: 30000   # web search is slower if used

tags:
  - news
  - search_expected
  - core_smoke

provenance:
  source: manual
  source_chat_date: "2026-05-12"
